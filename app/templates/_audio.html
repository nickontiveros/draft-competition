{# Sound bar + StadiumAudio engine. Everything is synthesized in WebAudio —
   no audio files, no external requests, original composition. #}
{% macro sound_bar() %}
<div class="sound-bar" title="Stadium sound (iOS: hardware silent switch also mutes)">
  <button id="sb-music" type="button" aria-label="Play stadium music" aria-pressed="false">
    <svg id="sb-music-play" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5 L13 8 L4 13.5 Z"/></svg>
    <svg id="sb-music-stop" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="display:none"><path d="M3.5 3.5 h3.4 v9 h-3.4 z M9.1 3.5 h3.4 v9 h-3.4 z"/></svg>
  </button>
  <button id="sb-mute" type="button" aria-label="Mute sound" aria-pressed="false">
    <svg id="sb-vol-on" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M2 6 v4 h2.6 L9 13.5 V2.5 L4.6 6 Z"/><path d="M10.8 5.2 a4 4 0 0 1 0 5.6 M12.6 3.4 a6.5 6.5 0 0 1 0 9.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <svg id="sb-vol-off" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="display:none"><path d="M2 6 v4 h2.6 L9 13.5 V2.5 L4.6 6 Z"/><path d="M11 6 l4 4 M15 6 l-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
  </button>
  <input id="sb-vol" type="range" min="0" max="100" value="70" aria-label="Volume">
</div>
{% endmacro %}

<script>
window.StadiumAudio = (function () {
  var ctx = null, master = null, musicBus = null, sfxBus = null;
  var noiseBuf = null, musicOn = false, schedTimer = null, nextNoteTime = 0, beat = 0;
  var state = { muted: false, vol: 0.7 };
  try {
    var saved = JSON.parse(localStorage.getItem('ffdc_audio') || '{}');
    if (typeof saved.muted === 'boolean') state.muted = saved.muted;
    if (typeof saved.vol === 'number') state.vol = Math.min(1, Math.max(0, saved.vol));
  } catch (e) {}

  function save() { try { localStorage.setItem('ffdc_audio', JSON.stringify(state)); } catch (e) {} }

  function ensureCtx() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ctx = new AC();
      master = ctx.createGain(); master.connect(ctx.destination);
      musicBus = ctx.createGain(); musicBus.gain.value = 0.16; musicBus.connect(master);
      sfxBus = ctx.createGain(); sfxBus.gain.value = 0.5; sfxBus.connect(master);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      applyGain();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  }
  function applyGain() { if (master) master.gain.value = state.muted ? 0 : state.vol; }

  /* ── tiny builders ── */
  function osc(type, freq, t) { var o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t); return o; }
  function env(t, a, peak, decay) {
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + decay);
    return g;
  }
  function noise(t, dur) { var s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(t); s.stop(t + dur); return s; }

  /* ── SFX ── */
  function airhorn(t) {
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2500; lp.connect(sfxBus);
    [437, 440, 443, 220].forEach(function (f, i) {
      var o = osc(i === 3 ? 'square' : 'sawtooth', f * 0.94, t);
      o.frequency.exponentialRampToValueAtTime(f, t + 0.06);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(i === 3 ? 0.12 : 0.16, t + 0.01);
      g.gain.setValueAtTime(i === 3 ? 0.12 : 0.16, t + 0.62);
      g.gain.linearRampToValueAtTime(0.0001, t + 0.85);
      o.connect(g); g.connect(lp); o.start(t); o.stop(t + 0.9);
    });
  }
  function cheer(t) {
    [{q: 0.8, peak: 0.5}, {q: 2, peak: 0.35}].forEach(function (l) {
      var s = noise(t, 2.1);
      var bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = l.q;
      bp.frequency.setValueAtTime(700, t);
      bp.frequency.linearRampToValueAtTime(1500, t + 0.9);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(l.peak, t + 0.4);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2);
      s.connect(bp); bp.connect(g); g.connect(sfxBus);
    });
    [0.25, 0.55, 0.85].forEach(function (off) {  // whistles
      var o = osc('sine', 2400, t + off);
      o.frequency.exponentialRampToValueAtTime(1800, t + off + 0.12);
      var g = env(t + off, 0.01, 0.06, 0.12);
      o.connect(g); g.connect(sfxBus); o.start(t + off); o.stop(t + off + 0.15);
    });
  }
  function trombone(t) {
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(sfxBus);
    var notes = [[233, 0.28], [220, 0.28], [208, 0.28], [196, 0.9]], off = 0;
    notes.forEach(function (n, i) {
      var f = n[0], dur = n[1], start = t + off;
      var o = osc('sawtooth', f * 1.03, start);
      o.frequency.linearRampToValueAtTime(f * 0.97, start + dur);
      if (i === 3) {  // vibrato on the final droop
        var lfo = osc('sine', 5, start), lg = ctx.createGain(); lg.gain.value = 6;
        lfo.connect(lg); lg.connect(o.frequency); lfo.start(start); lfo.stop(start + dur);
      }
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, start);
      g.gain.linearRampToValueAtTime(0.22, start + 0.02);
      g.gain.setValueAtTime(0.22, start + dur - 0.05);
      g.gain.linearRampToValueAtTime(0.0001, start + dur);
      o.connect(g); g.connect(lp); o.start(start); o.stop(start + dur + 0.05);
      off += dur + 0.05;
    });
  }

  /* ── music loop: 120 BPM, 2 bars, drumline + additive-sine organ ── */
  var SPB = 0.5;  // seconds per beat
  function kick(t) {
    var o = osc('sine', 150, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.12);
    var g = env(t, 0.003, 0.9, 0.15); o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.2);
  }
  function snare(t, vol) {
    vol = vol || 1;
    var s = noise(t, 0.15);
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800;
    var g = env(t, 0.002, 0.5 * vol, 0.12);
    s.connect(hp); hp.connect(g); g.connect(musicBus);
    var o = osc('triangle', 250, t); var g2 = env(t, 0.002, 0.25 * vol, 0.08);
    o.connect(g2); g2.connect(musicBus); o.start(t); o.stop(t + 0.1);
  }
  function shaker(t) {
    var s = noise(t, 0.05);
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6000;
    var g = env(t, 0.002, 0.12, 0.03);
    s.connect(hp); hp.connect(g); g.connect(musicBus);
  }
  function organ(t, freq, dur) {
    [[1, 1], [2, 0.5], [3, 0.25]].forEach(function (h) {
      var o = osc('sine', freq * h[0], t);
      var g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.16 * h[1], t + 0.005);
      g.gain.setValueAtTime(0.16 * h[1], t + dur - 0.02);
      g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.18);
      o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + dur + 0.2);
    });
  }
  function chord(t, freqs, dur) { freqs.forEach(function (f) { organ(t, f, dur); }); }
  function scheduleBeat(b, t) {
    var bar = Math.floor(b / 4) % 2, pos = b % 4;
    if (pos === 0 || pos === 2) kick(t);
    if (pos === 1 || pos === 3) snare(t);
    shaker(t); shaker(t + SPB / 2);
    if (bar === 1 && pos === 3) {  // drumline ghost drag into bar 1
      [0.5, 0.667, 0.833].forEach(function (fr) { snare(t + SPB * fr, 0.25); });
    }
    if (bar === 0) {  // G-minor stab bar
      if (pos === 0) chord(t, [196, 233, 294], SPB * 0.9);
      if (pos === 2) chord(t + SPB / 2, [196, 233, 294], SPB * 0.6);
    } else {          // original riff bar: G3 → Bb3 → C4 → D4
      organ(t, [196, 233.1, 261.6, 293.7][pos], SPB * 0.85);
    }
  }
  function schedulerTick() {
    while (nextNoteTime < ctx.currentTime + 0.12) {
      scheduleBeat(beat, nextNoteTime);
      nextNoteTime += SPB; beat++;
    }
  }
  function startMusic() {
    if (!ensureCtx() || musicOn) return;
    musicOn = true; beat = 0; nextNoteTime = ctx.currentTime + 0.05;
    schedTimer = setInterval(schedulerTick, 25);
  }
  function stopMusic() {
    musicOn = false;
    if (schedTimer) { clearInterval(schedTimer); schedTimer = null; }
  }

  var api = {
    isMuted: function () { return state.muted; },
    volume: function () { return state.vol; },
    musicPlaying: function () { return musicOn; },
    toggleMusic: function () { musicOn ? stopMusic() : startMusic(); return musicOn; },
    setMuted: function (m) { state.muted = !!m; save(); applyGain(); },
    setVolume: function (v) { state.vol = Math.min(1, Math.max(0, v)); save(); applyGain(); },
    sfx: function (name) {
      if (state.muted || !ctx) return;  // no context until first user gesture
      if (ctx.state === 'suspended') return;
      var t = ctx.currentTime + 0.02;
      if (name === 'airhorn') airhorn(t);
      else if (name === 'cheer') cheer(t);
      else if (name === 'trombone') trombone(t);
    },
  };

  // Arm the context on the first gesture anywhere so later SFX can play.
  document.addEventListener('pointerdown', function once() {
    ensureCtx();
    document.removeEventListener('pointerdown', once);
  }, { once: true });

  document.addEventListener('DOMContentLoaded', function () {
    var musicBtn = document.getElementById('sb-music');
    var muteBtn = document.getElementById('sb-mute');
    var vol = document.getElementById('sb-vol');
    if (!musicBtn) return;
    vol.value = Math.round(state.vol * 100);
    syncMute();
    musicBtn.addEventListener('click', function () {
      var on = api.toggleMusic();
      musicBtn.classList.toggle('on', on);
      musicBtn.setAttribute('aria-pressed', String(on));
      document.getElementById('sb-music-play').style.display = on ? 'none' : '';
      document.getElementById('sb-music-stop').style.display = on ? '' : 'none';
    });
    muteBtn.addEventListener('click', function () { api.setMuted(!state.muted); syncMute(); });
    vol.addEventListener('input', function () { ensureCtx(); api.setVolume(vol.value / 100); });
    function syncMute() {
      muteBtn.setAttribute('aria-pressed', String(state.muted));
      document.getElementById('sb-vol-on').style.display = state.muted ? 'none' : '';
      document.getElementById('sb-vol-off').style.display = state.muted ? '' : 'none';
    }
  });

  return api;
})();
</script>
