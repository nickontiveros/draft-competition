{# Sport icon SVG symbols. Referenced via <use href="#i-{slug}"> both by the
   sport_icon macro below and by the JS feed renderer in _app_js.html, so the
   slugs here must stay in sync with app/links.py sport_slug(). #}
<svg style="display:none" aria-hidden="true">
  <defs>
    <symbol id="i-football" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <ellipse cx="12" cy="12" rx="9" ry="5.6" transform="rotate(-38 12 12)"/>
      <path d="M9.5 14.5 L14.5 9.5"/>
      <path d="M10.4 10.9 L11.9 12.4 M11.9 9.4 L13.4 10.9 M8.9 12.4 L10.4 13.9"/>
    </symbol>
    <symbol id="i-tennis" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.2"/>
      <path d="M5.2 7.4 C9 9.4, 9 14.6, 5.2 16.6"/>
      <path d="M18.8 7.4 C15 9.4, 15 14.6, 18.8 16.6"/>
    </symbol>
    <symbol id="i-soccer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.2"/>
      <polygon points="12,8.6 15.2,10.9 14,14.6 10,14.6 8.8,10.9"/>
      <path d="M12 8.6 V3.8 M15.2 10.9 L19.8 9.4 M14 14.6 L16.9 18.4 M10 14.6 L7.1 18.4 M8.8 10.9 L4.2 9.4"/>
    </symbol>
    <symbol id="i-baseball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.2"/>
      <path d="M6.4 6.4 C9.4 9, 9.4 15, 6.4 17.6 M17.6 6.4 C14.6 9, 14.6 15, 17.6 17.6"/>
      <path d="M7.6 9.2 L9 9.9 M7.6 14.8 L9 14.1 M16.4 9.2 L15 9.9 M16.4 14.8 L15 14.1"/>
    </symbol>
    <symbol id="i-golf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="9.5" r="6"/>
      <circle cx="10" cy="8" r=".4"/><circle cx="13.5" cy="7.5" r=".4"/>
      <circle cx="11.5" cy="11" r=".4"/><circle cx="14.3" cy="10.5" r=".4"/>
      <path d="M9 19.5 h6 M12 15.5 v4"/>
    </symbol>
    <symbol id="i-basketball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="8.2"/>
      <path d="M12 3.8 V20.2 M3.8 12 H20.2"/>
      <path d="M6 6.2 C9 9, 9 15, 6 17.8 M18 6.2 C15 9, 15 15, 18 17.8"/>
    </symbol>
    <symbol id="i-hockey" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3.5 L11 13.5 C11.8 15, 13 15.5, 14.5 15.5 L17 15.5"/>
      <ellipse cx="16" cy="19.2" rx="4.4" ry="1.9"/>
    </symbol>
    <symbol id="i-mma" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 11 V7.5 A2.4 2.4 0 0 1 9.4 5.1 L14.6 5.1 A2.8 2.8 0 0 1 17.4 7.9 V12.2 A5.4 5.4 0 0 1 12 17.6 L10.4 17.6 A3.4 3.4 0 0 1 7 14.2 Z"/>
      <path d="M7 11.2 H12.6"/>
      <path d="M10.2 17.6 V20.2 H14.8"/>
    </symbol>
    <symbol id="i-generic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 3.5 V20.5"/>
      <path d="M6.5 4.5 L18.5 7.5 L6.5 10.5 Z"/>
    </symbol>
  </defs>
</svg>

{% macro sport_icon(slug) -%}
<span class="sicon sicon-{{ slug }}" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24"><use href="#i-{{ slug }}"/></svg></span>
{%- endmacro %}
