# Fly.io config — deploy with:
#   fly launch --copy-config --no-deploy
#   fly volumes create tracker_data --size 1
#   fly secrets set ADMIN_TOKEN=<random> CRED_SECRET=<fernet-key>
#   fly deploy
app = "prediction-draft-tracker"
primary_region = "ord"

[build]

[env]
  DB_PATH = "/data/tracker.db"
  SYNC_INTERVAL_MINUTES = "5"

[[mounts]]
  source = "tracker_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # keep the sync scheduler running
  auto_start_machines = true
  min_machines_running = 1
